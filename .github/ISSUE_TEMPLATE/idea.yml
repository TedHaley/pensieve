name: Idea
description: Something that would make Pensieve better for you or your agents.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you want to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: An example
      description: A search, a task or a moment where this would have helped.
