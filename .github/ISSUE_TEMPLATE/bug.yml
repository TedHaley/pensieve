name: Bug
description: Something in Pensieve does not work, or gives a wrong result.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did (the search, the tool call or the click), what you got, and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pensieve version
      description: In the menu bar icon, or Settings → General.
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Your Mac (chip, macOS version), the agent, and lines from ~/.pensieve/server.log if there was an error. Leave out private code.
