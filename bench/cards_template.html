<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread cards</title>
<style>
:root { --bg:#f6f6f4; --ink:#1b1b1d; --muted:#6b6b70; --line:#dcdcd8; --panel:#ffffff; --chip:#ececE8;
  --open:#1f8a3b; --stale:#b26a00; --closed:#6b6b70; --unknown:#9a9aa0; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#161617; --ink:#ececec; --muted:#9a9aa0;
  --line:#34343a; --panel:#1f1f21; --chip:#2a2a2e; --open:#4cd46e; --stale:#f0a33a; --closed:#9a9aa0; --unknown:#9a9aa0; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#161617; --ink:#ececec; --muted:#9a9aa0; --line:#34343a; --panel:#1f1f21; --chip:#2a2a2e;
  --open:#4cd46e; --stale:#f0a33a; --closed:#9a9aa0; --unknown:#9a9aa0; color-scheme: dark; }
body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 -apple-system, system-ui, sans-serif;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:18px 40px; }
main { max-width:1040px; margin:0 auto; display:flex; flex-direction:column; gap:14px; min-width:0; }
h1 { font-size:20px; margin:0; font-weight:650; }
.sub, .muted { color:var(--muted); font-size:12px; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
select, input { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 9px; min-width:0; }
input[type=search] { flex:1 1 220px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; min-width:0; }
.card-h { display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; justify-content:space-between; min-width:0; }
.title { font-weight:650; overflow-wrap:anywhere; }
.sinks { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
.sink { border-top:1px solid var(--line); padding-top:6px; min-width:0; }
.line { display:flex; flex-wrap:wrap; gap:6px; align-items:center; min-width:0; overflow-wrap:anywhere; }
.kind { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
.name { font-weight:550; overflow-wrap:anywhere; }
.link { color:var(--muted); font-size:12px; }
.pill { display:inline-block; font-size:11px; padding:1px 8px; border-radius:99px; background:var(--chip); white-space:nowrap; }
.s-open { color:var(--open); } .s-stale { color:var(--stale); } .s-closed { color:var(--closed); } .s-unknown { color:var(--unknown); }
details.done { margin-top:8px; border-top:1px solid var(--line); padding-top:6px; }
details.done summary { cursor:pointer; color:var(--muted); font-size:12px; }
.more { color:var(--muted); font-size:12px; margin-top:6px; }
.source { margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
.source code { font-size:11px; }
.empty { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Thread cards</h1>
    <div class="sub" id="built"></div>
  </div>
  <div class="bar">
    <select id="state" aria-label="Filter by state">
      <option value="">All states</option>
      <option value="open">Open</option>
      <option value="stale">Stale</option>
      <option value="closed">Closed</option>
      <option value="unknown">Unknown</option>
    </select>
    <input id="q" type="search" placeholder="Search titles, PRs, branches, tickets" aria-label="Search">
    <span class="muted" id="count"></span>
  </div>
  <div id="cards" style="display:flex;flex-direction:column;gap:12px"></div>
</main>
<script>
const DATA = __DATA__;
const CAP = 20; // closed items shown under the dropdown; more are counted, not drawn
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = ts => ts ? new Date(ts * 1000).toISOString().slice(0, 16).replace("T", " ") : "";
const CLOSED = new Set(["closed", "MERGED", "CLOSED", "DELETED", "done"]);
const RANK = {open: 0, OPEN: 0, EXISTS: 0, stale: 1, unknown: 2, UNKNOWN: 2};
const group = s => CLOSED.has(s) ? "closed" : (RANK[s] === 0 ? "open" : (s === "stale" ? "stale" : "unknown"));
const cls = s => ({open:"s-open", OPEN:"s-open", EXISTS:"s-open", stale:"s-stale", closed:"s-closed", MERGED:"s-closed", CLOSED:"s-closed", DELETED:"s-closed", done:"s-closed"})[s] || "s-unknown";
const label = s => ({open:"open", OPEN:"open", EXISTS:"exists", stale:"stale", closed:"closed", MERGED:"merged", CLOSED:"closed", DELETED:"deleted", done:"done", unknown:"unknown", UNKNOWN:"unknown"})[s] || s;
const pill = s => `<span class="pill ${cls(s)}">${esc(label(s))}</span>`;

// One line per sink, with its partners in the same line: a branch shows its PR and ticket; a PR shows its branch and ticket.
function line(s) {
  const bits = [];
  if (s.kind === 'branch') {
    bits.push(`<span class="kind">branch</span><span class="name">${esc(s.name)}</span>${pill(s.state)}`);
    s.prs.forEach(p => bits.push(`<span class="link">→ PR ${esc(p.key)}</span>${pill(p.state)}`));
    s.tickets.forEach(t => bits.push(`<span class="link">→ ${esc(t.key)}</span>${pill(t.state)}`));
  } else if (s.kind === 'pr') {
    bits.push(`<span class="kind">PR</span><span class="name">${esc(s.name)}</span>${pill(s.state)}`);
    if (s.branch) bits.push(`<span class="link">← ${esc(s.branch.split('@').pop())}</span>`);
    s.tickets.forEach(t => bits.push(`<span class="link">→ ${esc(t.key)}</span>${pill(t.state)}`));
  } else {
    bits.push(`<span class="kind">${esc(s.kind)}</span><span class="name">${esc(s.name)}</span>${pill(s.state)}`);
  }
  const title = s.title ? `<div class="link">${esc(s.title)}</div>` : '';
  return `<div class="sink"><div class="line">${bits.join(' ')}</div>${title}</div>`;
}

function card(c) {
  const sorted = [...c.sinks].sort((a, b) => ['open', 'stale', 'unknown', 'closed'].indexOf(group(a.state)) - ['open', 'stale', 'unknown', 'closed'].indexOf(group(b.state)));
  const active = sorted.filter(s => group(s.state) !== 'closed');
  const done = sorted.filter(s => group(s.state) === 'closed');
  const shown = done.slice(0, CAP), hidden = done.length - shown.length;
  const doneBlock = done.length ? `<details class="done"><summary>${done.length} closed, merged or deleted</summary>
      ${shown.map(line).join('')}${hidden > 0 ? `<div class="more">+ ${hidden} more not shown</div>` : ''}</details>` : '';
  const title = DATA.titles?.[c.id] || c.source.title || c.source.session;
  return `<section class="card">
    <div class="card-h"><span class="title">${esc(title)}</span>${pill(c.state)}</div>
    <div class="sinks">${active.length ? active.map(line).join('') : '<div class="empty">No open sinks</div>'}</div>
    ${doneBlock}
    <div class="source">Source: session <code>${esc(c.source.session)}</code>${c.source.folder ? ' · folder <code>' + esc(c.source.folder) + '</code>' : ''} · last written ${esc(ago(c.source.written))}</div>
  </section>`;
}

function render() {
  const st = $("state").value, q = $("q").value.trim().toLowerCase();
  const rows = DATA.cards.filter(c => {
    if (st && c.state !== st) return false;
    if (!q) return true;
    const hay = [DATA.titles?.[c.id] || '', c.source.title, c.source.session, ...c.sinks.flatMap(s => [s.name, s.title || '', s.branch || '',
      ...s.prs.map(p => p.key + ' ' + p.title), ...s.tickets.map(t => t.key)])].join(' ').toLowerCase();
    return hay.includes(q);
  });
  $("count").textContent = rows.length + " of " + DATA.cards.length + " cards";
  $("cards").innerHTML = rows.map(card).join('') || '<div class="empty">No cards match.</div>';
}

$("built").textContent = "Built from " + DATA.cards.length + " sessions. Open first, then stale, then closed.";
$("state").addEventListener("input", render);
$("q").addEventListener("input", render);
render();
</script>
</body>
</html>
