<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work graph with states</title>
<style>
:root { --bg:#f6f6f4; --ink:#1b1b1d; --muted:#6b6b70; --line:#c8c8c4; --panel:#ffffff; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#161617; --ink:#ececec; --muted:#9a9aa0; --line:#4a4a50; --panel:#1f1f21; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#161617; --ink:#ececec; --muted:#9a9aa0; --line:#4a4a50; --panel:#1f1f21; color-scheme: dark; }
body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 -apple-system, system-ui, sans-serif; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 0; }
h1 { font-size:18px; margin:0; font-weight:650; }
.legend span { display:inline-flex; align-items:center; gap:5px; margin-right:12px; color:var(--muted); }
.legend i { width:10px; height:10px; border-radius:50%; display:inline-block; }
label { color:var(--muted); }
.wrap { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:12px; }
@media (max-width:860px) { .wrap { grid-template-columns:1fr; } }
svg { width:100%; height:72vh; background:var(--panel); border:1px solid var(--line); border-radius:12px; touch-action:none; }
aside { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; max-height:72vh; overflow:auto; min-width:0; }
aside button { display:block; width:100%; text-align:left; border:0; background:none; color:var(--ink); padding:6px 8px; border-radius:8px; font:inherit; cursor:pointer; overflow-wrap:anywhere; }
aside button:hover, aside button.on { background:var(--bg); }
aside .n { color:var(--muted); font-size:12px; }
#tip { position:fixed; pointer-events:none; background:var(--panel); border:1px solid var(--line); padding:6px 9px; border-radius:8px; font-size:12px; display:none; max-width:360px; }
.note { color:var(--muted); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>Work graph, with states</h1>
  <div class="legend">
    <span><i style="background:#1f8a3b"></i>open</span>
    <span><i style="background:#b26a00"></i>stale</span>
    <span><i style="background:#6b6b70"></i>closed</span>
    <span><i style="background:#c8c8c4"></i>unknown</span>
    <span><i style="background:transparent;border:1.5px solid #6b6b70"></i>thought</span>
  </div>
  <label><input id="mentions" type="checkbox"> mentions</label>
  <span class="note" id="count"></span>
</header>
<div class="wrap">
  <svg id="g" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet"></svg>
  <aside id="threads"></aside>
</div>
<div id="tip"></div>
<p class="note">Solid lines: the session wrote to it. Dashed: named in text only. A thread is the sessions that write to the same sink. Click a thread to highlight it.</p>
<script>
const DATA = __DATA__;
const STATE = {open:'#1f8a3b', stale:'#b26a00', closed:'#6b6b70', unknown:'#c8c8c4'};
const KIND = {branch:'#0a84ff', pr:'#bf5af2', ticket:'#ff9f0a'};
const svg = document.getElementById('g'), tip = document.getElementById('tip'), side = document.getElementById('threads');
const NS = 'http://www.w3.org/2000/svg';
let nodes = [], links = [], idx = {}, focus = null;

function build() {
  const showM = document.getElementById('mentions').checked;
  const rel = DATA.relations.filter(r => showM || r.strength === 'write');
  const keep = new Set();
  rel.forEach(r => { keep.add(r.source); keep.add(r.target); });
  const pairs = new Map();
  rel.forEach(r => {
    const k = r.source + '|' + r.target, p = pairs.get(k) || {source: r.source, target: r.target, strong: false};
    p.strong = p.strong || r.strength === 'write'; pairs.set(k, p);
  });
  nodes = DATA.nodes.filter(n => keep.has(n.id)).map(n => ({...n,
    x: 500 + (Math.random() - .5) * 400, y: 360 + (Math.random() - .5) * 300, vx: 0, vy: 0}));
  idx = Object.fromEntries(nodes.map((n, i) => [n.id, i]));
  links = [...pairs.values()].filter(p => p.source in idx && p.target in idx).map(p => ({...p, s: idx[p.source], t: idx[p.target]}));
  document.getElementById('count').textContent = nodes.length + ' nodes, ' + links.length + ' links';
  for (let i = 0; i < 400; i++) step();
  draw();
}

function step() {
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
    const a = nodes[i], b = nodes[j]; let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + 0.01;
    const f = 900 / d2, d = Math.sqrt(d2); dx /= d; dy /= d;
    a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
  }
  links.forEach(l => { const a = nodes[l.s], b = nodes[l.t]; const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) + 0.01, k = (d - 70) * 0.02 * (l.strong ? 1.3 : 0.6);
    a.vx += dx / d * k; a.vy += dy / d * k; b.vx -= dx / d * k; b.vy -= dy / d * k; });
  nodes.forEach(n => { n.vx += (500 - n.x) * 0.002; n.vy += (360 - n.y) * 0.002; n.x += n.vx * 0.4; n.y += n.vy * 0.4; n.vx *= 0.6; n.vy *= 0.6; });
}

function inFocus(n) {
  if (!focus) return true;
  return focus.sessions.includes(n.id) || focus.sinks.includes(n.id);
}

function draw() {
  svg.innerHTML = '';
  links.forEach(l => { const a = nodes[l.s], b = nodes[l.t];
    const ln = document.createElementNS(NS, 'line');
    ln.setAttribute('x1', a.x); ln.setAttribute('y1', a.y); ln.setAttribute('x2', b.x); ln.setAttribute('y2', b.y);
    ln.setAttribute('style', 'stroke:var(--line)'); ln.setAttribute('stroke-width', l.strong ? 1.4 : 1);
    ln.setAttribute('opacity', focus && !(inFocus(a) && inFocus(b)) ? 0.1 : 0.9);
    if (!l.strong) ln.setAttribute('stroke-dasharray', '4 4');
    svg.appendChild(ln); });
  nodes.forEach(n => {
    const c = document.createElementNS(NS, 'circle');
    const isSession = n.kind === 'session';
    c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); c.setAttribute('r', isSession ? 5 : 8);
    if (isSession && !n.state) { c.setAttribute('fill', 'none'); c.setAttribute('style', 'stroke:#6b6b70'); c.setAttribute('stroke-width', 1.5); }
    else if (isSession) { c.setAttribute('fill', STATE[n.state]); }
    else { c.setAttribute('fill', KIND[n.kind] || '#999'); c.setAttribute('style', 'stroke:' + (STATE[n.state] || '#999')); c.setAttribute('stroke-width', 3); }
    c.setAttribute('opacity', inFocus(n) ? 1 : 0.15);
    c.addEventListener('mouseenter', () => { tip.style.display = 'block'; tip.textContent = n.kind + ' · ' + (n.state || 'thought') + ' · ' + n.label; });
    c.addEventListener('mousemove', e => { tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; });
    c.addEventListener('mouseleave', () => tip.style.display = 'none');
    svg.appendChild(c); });
}

function list() {
  side.innerHTML = DATA.threads.map(t => `<button data-t="${t.id}" class="${focus && focus.id === t.id ? 'on' : ''}">
    <span style="color:${STATE[t.state]}">●</span> ${String(t.titles[0]).replace(/</g, '&lt;')}
    <div class="n">${t.state} · ${t.sessions.length} session${t.sessions.length === 1 ? '' : 's'} · ${t.sinks.length} sink${t.sinks.length === 1 ? '' : 's'} · ${t.quiet_days} d quiet</div></button>`).join('');
  side.querySelectorAll('button').forEach(b => b.onclick = () => {
    const t = DATA.threads.find(x => x.id === b.dataset.t);
    focus = focus && focus.id === t.id ? null : t; list(); draw();
  });
}

document.getElementById('mentions').addEventListener('change', build);
build(); list();
</script>
</body>
</html>
