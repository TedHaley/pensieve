[project]
name = "pensieve"
version = "0.1.0"
description = "A local 3D knowledge map of your AI coding sessions (Claude Code, Codex, Qwen Code), linked to your git repos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.3",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "turbovec>=1.1.2",
    "umap-learn>=0.5.12",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pensieve = "pensieve.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
