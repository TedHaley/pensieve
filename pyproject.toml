[project]
name = "pensieve"
version = "0.7.7"
description = "One place for all your information, for context engineering: search your documents, git repos, AI agent sessions, tickets and messages, with an MCP server for agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.3",
    "httpx>=0.28.1",
    "mcp>=1.12",
    "mlx-lm>=0.32 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "numpy>=2.5.3",
    "pillow>=11",
    "pypdf>=6.19.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0 ; platform_machine != 'arm64' or sys_platform != 'darwin'",
    "turbovec>=1.1.2",
    "umap-learn>=0.5.12",
    "uvicorn[standard]>=0.54.0",
    "watchdog>=6.0.0",
]

[project.scripts]
pensieve = "pensieve.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
